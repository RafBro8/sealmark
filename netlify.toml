# Netlify reads this from the repo root; Cloudflare Pages takes the same two
# values in its dashboard instead. Security headers and the SPA fallback come
# from packages/web/public/_headers and _redirects, which both hosts read from
# the published directory.
[build]
  command = "npm run build --workspace @sealmark/web"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "24"
